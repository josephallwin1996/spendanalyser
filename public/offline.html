<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <title>Tandem - Offline</title>
    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #08090b;
        color: #f5f6f8;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100% - 48px));
        text-align: center;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #8d93a1; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #cdf56b;
        color: #08090b;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to sync your spending and budgets.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
